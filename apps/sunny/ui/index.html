<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunny</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sheet">
      <header class="bar">
        <span class="logo" aria-hidden="true">☀️</span>
        <input
          id="query"
          class="query"
          type="text"
          placeholder="Search apps…"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
        <select id="clipFilter" class="clip-filter" hidden title="Filter content type">
          <option value="all">All</option>
          <option value="text">Text</option>
        </select>
      </header>

      <div class="clip-head" id="clipHead" hidden>
        <span class="clip-count" id="clipCount">0 items</span>
        <button class="pause-btn" id="pauseBtn" type="button">
          <span id="pauseLabel">Pause clipboard</span>
          <span class="pause-ico" id="pauseIco">⏸</span>
        </button>
      </div>

      <main class="body">
        <div class="list" id="list" role="listbox" aria-label="Results"></div>
        <aside class="detail" id="detail" hidden></aside>
      </main>

      <footer class="hints" id="hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>:</kbd> emoji</span>
        <span><kbd>Alt</kbd>+<kbd>Space</kbd> hide</span>
      </footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
