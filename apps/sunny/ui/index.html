<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunny</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <div class="sheet">
      <!-- Titlebar kustom: hanya tampil di jendela Settings (frameless). -->
      <header class="titlebar" id="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <img class="titlebar-logo" src="sunny-icon.png" alt="" draggable="false" />
          <span class="titlebar-title" data-tauri-drag-region>Settings</span>
        </div>
        <div class="titlebar-controls">
          <button class="win-btn" id="winMin" type="button" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" /></svg>
          </button>
          <button class="win-btn" id="winMax" type="button" title="Maximize" aria-label="Maximize">
            <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="2.5" y="2.5" width="5" height="5" rx="0.6" /></svg>
          </button>
          <button class="win-btn win-close" id="winClose" type="button" title="Close" aria-label="Close">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" /></svg>
          </button>
        </div>
      </header>
      <header class="bar">
        <img class="logo" src="sunny-icon.png" alt="Sunny" draggable="false" />
        <input
          id="query"
          class="query"
          type="text"
          placeholder="Search apps…"
          autocomplete="off"
          spellcheck="false"
          autofocus
        />
        <select id="clipFilter" class="clip-filter" hidden title="Filter content type">
          <option value="all">All</option>
          <option value="text">Text</option>
        </select>
      </header>

      <div class="clip-head" id="clipHead" hidden>
        <span class="clip-count" id="clipCount">0 items</span>
        <button class="pause-btn" id="pauseBtn" type="button">
          <span id="pauseLabel">Pause clipboard</span>
          <span class="pause-ico" id="pauseIco">⏸</span>
        </button>
      </div>

      <section class="settings" id="settings" hidden>
        <aside class="settings-nav">
          <div class="settings-nav-head">
            <button class="icon-btn" id="settingsBack" type="button" title="Back (Esc)">‹</button>
            <span class="settings-title">Settings</span>
          </div>
          <div class="settings-search">
            <span class="settings-search-ico" aria-hidden="true">⌕</span>
            <input
              id="settingsSearch"
              class="settings-search-input"
              type="text"
              placeholder="Search settings…"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <nav class="settings-tabs" id="settingsTabs" role="tablist" aria-label="Settings sections"></nav>
          <div class="settings-nav-foot">
            <span class="settings-saved" id="settingsSaved"></span>
          </div>
        </aside>
        <div class="settings-main">
          <div class="settings-body" id="settingsBody" role="tabpanel"></div>
          <footer class="hints settings-foot">
            <span><kbd>Esc</kbd> back</span>
            <span class="spacer"></span>
            <span class="settings-note">Changes are saved automatically</span>
          </footer>
        </div>
      </section>

      <main class="body">
        <div class="list" id="list" role="listbox" aria-label="Results"></div>
        <aside class="detail" id="detail" hidden></aside>
      </main>

      <footer class="hints" id="hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>:</kbd> emoji</span>
        <span><kbd>Alt</kbd>+<kbd>Space</kbd> hide</span>
      </footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
