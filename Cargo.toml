[workspace]
resolver = "2"
members = [
    "apps/sunny/src-tauri",
    "crates/sun-core",
    "crates/sun-platform",
]

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = "s" # supernova: kecil & ringan
